<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nurislam Cars — аренда авто</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --surface:#14171c; --ink:#eef0f2; --dim:#9aa1a8;
  --accent:#4fa3ff; --line:#262b31;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;} html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;}
.wrap{max-width:1020px;margin:0 auto;padding:0 24px;}
a{color:inherit;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.3px;}

header{padding:22px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;}
.nav{display:flex;justify-content:space-between;align-items:center;}
.mark{font-family:'Fraunces',serif;font-size:20px;}
.mark b{color:var(--accent);}

.hero{padding:56px 0 30px;}
.hero h1{font-size:clamp(30px,5.5vw,46px);max-width:14ch;}
.hero p{color:var(--dim);max-width:48ch;margin-top:12px;}

.tabs{display:flex;gap:8px;margin:26px 0 22px;flex-wrap:wrap;}
.tab{padding:9px 18px;border:1px solid var(--line);border-radius:30px;font-size:13px;color:var(--dim);cursor:pointer;background:none;}
.tab.active{border-color:var(--accent);color:var(--accent);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding-bottom:60px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .2s;}
.card:hover{border-color:var(--accent);}
.card svg{width:100%;height:70px;stroke:var(--dim);}
.card h3{font-size:17px;margin-top:10px;}
.card .seg{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;}
.card .price{margin-top:10px;font-family:'Fraunces',serif;font-size:18px;}
.card .price span{color:var(--dim);font-family:'Inter',sans-serif;font-size:12px;}

#detail{display:none;padding:40px 0 70px;}
.back{color:var(--dim);font-size:13px;cursor:pointer;}
.d-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:20px 0 24px;flex-wrap:wrap;}
.d-head h2{font-size:clamp(26px,5vw,38px);}
.d-hero-svg{width:100%;max-width:420px;stroke:var(--accent);}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;}
.specs div span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.d-price{font-family:'Fraunces',serif;font-size:26px;color:var(--accent);margin:18px 0;}
.btn{display:inline-block;padding:15px 32px;background:var(--accent);color:#0b0d10;font-weight:600;font-size:14px;border-radius:8px;border:none;cursor:pointer;}

footer{border-top:1px solid var(--line);padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="mark">Nurislam Cars</div>
  <div style="color:var(--dim);font-size:13px;">Туран 55/10 · +7 705 705 14 88</div>
</div></header>

<main class="wrap">
  <section id="catalog">
    <div class="hero">
      <h1>Прокат авто без компромиссов</h1>
      <p>От городского эконом-класса до бизнес-седанов — подача в течение часа, полная страховка включена.</p>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="detail">
    <div class="back" onclick="showCatalog()">← Ко всем автомобилям</div>
    <div id="detail-content"></div>
  </section>
</main>

<footer class="wrap">
  <span>© 2026 Nurislam Cars</span>
  <span>Туран 55/10, Астана</span>
</footer>

<script>
const CAR_ICON = `<svg viewBox="0 0 200 90" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
<path d="M20 60 L35 30 Q45 20 70 20 L130 20 Q155 20 165 30 L180 60"/>
<path d="M10 60 H190 V72 Q190 78 184 78 H16 Q10 78 10 72 Z"/>
<circle cx="50" cy="78" r="10"/><circle cx="150" cy="78" r="10"/>
<line x1="70" y1="20" x2="65" y2="45"/><line x1="130" y1="20" x2="135" y2="45"/>
</svg>`;

const CARS = [
 {id:"solaris",seg:"economy",name:"Hyundai Solaris",year:2023,price:9500,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Экономичный седан для города — лёгкий в парковке, низкий расход топлива, идеален для ежедневных поездок."},
 {id:"rio",seg:"economy",name:"Kia Rio",year:2022,price:9000,trans:"МКПП",fuel:"Бензин",seats:5,desc:"Надёжный и простой в управлении хэтчбек, отличный выбор для первой аренды."},
 {id:"logan",seg:"economy",name:"Renault Logan",year:2021,price:8000,trans:"МКПП",fuel:"Бензин",seats:5,desc:"Просторный салон и большой багажник по минимальной цене."},
 {id:"cobalt",seg:"economy",name:"Chevrolet Cobalt",year:2022,price:8500,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Комфортный седан с автоматом — популярный выбор для такси и поездок по городу."},
 {id:"vesta",seg:"economy",name:"Lada Vesta",year:2023,price:8800,trans:"МКПП",fuel:"Бензин",seats:5,desc:"Современная отделка салона, климат-контроль, приятная динамика."},

 {id:"camry",seg:"standard",name:"Toyota Camry",year:2023,price:22000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Эталон комфорта в своём классе — плавный ход, тихий салон, статусный вид."},
 {id:"octavia",seg:"standard",name:"Skoda Octavia",year:2022,price:17000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Немецкая сборка, продуманная эргономика, отличная управляемость."},
 {id:"passat",seg:"standard",name:"Volkswagen Passat",year:2022,price:18000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Просторный бизнес-седан среднего класса для деловых поездок."},
 {id:"sonata",seg:"standard",name:"Hyundai Sonata",year:2023,price:19000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Динамичный дизайн и богатая комплектация — камера, подогрев, круиз-контроль."},
 {id:"k5",seg:"standard",name:"Kia K5",year:2023,price:20000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Спортивный силуэт и современная мультимедиа-система."},

 {id:"eclass",seg:"business",name:"Mercedes-Benz E-Class",year:2023,price:45000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Флагманский комфорт, кожаный салон, идеально для встреч и трансферов."},
 {id:"5series",seg:"business",name:"BMW 5 Series",year:2022,price:43000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Драйверский характер в сочетании с представительским статусом."},
 {id:"a6",seg:"business",name:"Audi A6",year:2023,price:44000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Технологичный интерьер, полный привод quattro, безупречная плавность."},
 {id:"g80",seg:"business",name:"Genesis G80",year:2023,price:42000,trans:"АКПП",fuel:"Бензин",seats:5,desc:"Премиум без переплаты за бренд — тихий салон и щедрая комплектация."},
 {id:"es",seg:"business",name:"Lexus ES",year:2022,price:41000,trans:"АКПП",fuel:"Гибрид",seats:5,desc:"Гибридная силовая установка, минимальный расход, максимальный комфорт."},
];

const SEG_LABEL = {economy:"Эконом", standard:"Средний", business:"Бизнес"};
let activeSeg = "all";

function renderTabs(){
  const segs = ["all","economy","standard","business"];
  document.getElementById("tabs").innerHTML = segs.map(s=>
    `<button class="tab ${s===activeSeg?'active':''}" onclick="setSeg('${s}')">${s==='all'?'Все':SEG_LABEL[s]}</button>`
  ).join("");
}
function setSeg(s){ activeSeg=s; renderTabs(); renderGrid(); }

function renderGrid(){
  const list = CARS.filter(c=>activeSeg==='all'||c.seg===activeSeg);
  document.getElementById("grid").innerHTML = list.map(c=>`
    <div class="card" onclick="location.hash='${c.id}'">
      ${CAR_ICON}
      <div class="seg">${SEG_LABEL[c.seg]}</div>
      <h3>${c.name}</h3>
      <div class="price">${c.price.toLocaleString('ru-RU')} ₸ <span>/ сутки</span></div>
    </div>`).join("");
}

function renderDetail(car){
  document.getElementById("detail-content").innerHTML = `
    <div class="d-head">
      <div><div class="seg">${SEG_LABEL[car.seg]} · ${car.year}</div><h2>${car.name}</h2></div>
    </div>
    <div class="d-hero-svg">${CAR_ICON}</div>
    <p style="color:var(--dim);max-width:56ch;margin-top:18px;">${car.desc}</p>
    <div class="specs">
      <div><span>Коробка</span>${car.trans}</div>
      <div><span>Топливо</span>${car.fuel}</div>
      <div><span>Мест</span>${car.seats}</div>
      <div><span>Год</span>${car.year}</div>
    </div>
    <div class="d-price">${car.price.toLocaleString('ru-RU')} ₸ / сутки</div>
    <button class="btn" onclick="location.href='tel:+77057051488'">Забронировать по телефону</button>
  `;
}

function showCatalog(){ location.hash=''; }

function route(){
  const id = location.hash.replace('#','');
  const car = CARS.find(c=>c.id===id);
  if(car){
    document.getElementById('catalog').style.display='none';
    document.getElementById('detail').style.display='block';
    renderDetail(car);
    window.scrollTo(0,0);
  } else {
    document.getElementById('catalog').style.display='block';
    document.getElementById('detail').style.display='none';
  }
}
window.addEventListener('hashchange', route);
renderTabs(); renderGrid(); route();
</script>
</body>
</html>
